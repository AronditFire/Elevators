map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Один origin для React, Go REST API и WebSocket; имя backend разрешается внутри Docker-сети.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Сохраняем внешний host с портом: backend сопоставляет его с Origin браузера.
        proxy_set_header Host $http_host;
        # Эти заголовки переводят HTTP-соединение в WebSocket для потока состояния.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }
}
