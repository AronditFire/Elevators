services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elevators}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-elevators}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    build: ./backend
    image: elevators-backend:local
    command: ["./migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-elevators}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-elevators}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    image: elevators-backend:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-elevators}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-elevators}?sslmode=disable
      HTTP_ADDRESS: :8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
