<text x="300" y="138.64" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111">Симулятор работы лифтов</text>
<text x="280" y="59.08" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#111">Диаграмма вариантов использования</text>
<text x="13.0" y="1130.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Пользователь</text>
<text x="2.0" y="2270.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Администратор</text>
<text x="453.5" y="235.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Войти в приложение</text>
<text x="446.5" y="380.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Настроить симуляцию</text>
<text x="468.5" y="608.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Задать сценарий</text>
<text x="428.5" y="632.0" font-family="Arial, sans-serif" font-size="18" fill="#111">генерации людей и тревог</text>
<text x="432.0" y="855.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Добавить людей вручную</text>
<text x="448.0" y="980.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Запустить симуляцию</text>
<text x="458.5" y="1105.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Поставить на паузу</text>
<text x="436.5" y="1230.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Возобновить симуляцию</text>
<text x="429.5" y="1355.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Изменить темп симуляции</text>
<text x="480.0" y="1468.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Нажать «Ход»</text>
<text x="442.0" y="1492.0" font-family="Arial, sans-serif" font-size="18" fill="#111">для выбранного лифта</text>
<text x="420.0" y="1605.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Включить пожарную тревогу</text>
<text x="413.5" y="1730.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Выключить пожарную тревогу</text>
<text x="437.5078125" y="1843.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Наблюдать за лифтами,</text>
<text x="418.5" y="1867.0" font-family="Arial, sans-serif" font-size="18" fill="#111">людьми и строкой состояния</text>
<text x="441.0" y="2000.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Остановить симуляцию</text>
<text x="438.5" y="2145.48" font-family="Arial, sans-serif" font-size="18" fill="#111">Просмотреть статистику</text>
<text x="1132.0" y="339.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Задать здание, параметры</text>
<text x="1120.5" y="363.0" font-family="Arial, sans-serif" font-size="18" fill="#111">и начальные позиции лифтов</text>
<text x="1163.5" y="467.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Выбрать стратегию</text>
<text x="1154.5" y="491.0" font-family="Arial, sans-serif" font-size="18" fill="#111">управления лифтами</text>
<text x="1180.0" y="209.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Импортировать</text>
<text x="1156.5078125" y="233.0" font-family="Arial, sans-serif" font-size="18" fill="#111">конфигурацию YAML</text>
<text x="1177.5" y="594.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Экспортировать</text>
<text x="1156.5078125" y="618.0" font-family="Arial, sans-serif" font-size="18" fill="#111">конфигурацию YAML</text>
<text x="1180.0" y="724.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Импортировать</text>
<text x="1178.5078125" y="748.0" font-family="Arial, sans-serif" font-size="18" fill="#111">сценарий YAML</text>
<text x="1177.5" y="849.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Экспортировать</text>
<text x="1178.5078125" y="873.0" font-family="Arial, sans-serif" font-size="18" fill="#111">сценарий YAML</text>
<text x="1149.5" y="1984.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Проверить: все лифты</text>
<text x="1150.0" y="2008.0" font-family="Arial, sans-serif" font-size="18" fill="#111">пустые и остановлены</text>
<text x="1177.5" y="2133.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Экспортировать</text>
<text x="1167.5" y="2157.0" font-family="Arial, sans-serif" font-size="18" fill="#111">статистику в файл</text>
<text x="410.5078125" y="2294.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Управлять учётными записями</text>
<text x="467.5" y="2318.0" font-family="Arial, sans-serif" font-size="18" fill="#111">и назначать роли</text>
<text x="1158.0078125" y="2294.96" font-family="Arial, sans-serif" font-size="18" fill="#111">Управлять сеансами</text>
<text x="1151.0" y="2318.0" font-family="Arial, sans-serif" font-size="18" fill="#111">других пользователей</text>
<text x="1044" y="1029.08" font-family="Arial, sans-serif" font-size="17" fill="#111">Ограничения сеанса</text>
<text x="1044" y="1050.8400000000001" font-family="Arial, sans-serif" font-size="17" fill="#111"></text>
<text x="1044" y="1072.6000000000001" font-family="Arial, sans-serif" font-size="17" fill="#111">До первого запуска: не более 20 этажей и 5</text>
<text x="1044" y="1094.3600000000001" font-family="Arial, sans-serif" font-size="17" fill="#111">лифтов; индивидуальные вместимость,</text>
<text x="1044" y="1116.1200000000001" font-family="Arial, sans-serif" font-size="17" fill="#111">скорость, ускорение и начальный этаж.</text>
<text x="1044" y="1137.88" font-family="Arial, sans-serif" font-size="17" fill="#111"></text>
<text x="1044" y="1159.64" font-family="Arial, sans-serif" font-size="17" fill="#111">После первого запуска конфигурация и стратегия</text>
<text x="1044" y="1181.4" font-family="Arial, sans-serif" font-size="17" fill="#111">фиксированы. Новый YAML применяется к</text>
<text x="1044" y="1203.16" font-family="Arial, sans-serif" font-size="17" fill="#111">новому или ещё не запущенному сеансу.</text>
<text x="1044" y="1344.96" font-family="Arial, sans-serif" font-size="17" fill="#111">Добавление людей доступно в любом состоянии</text>
<text x="1044" y="1366.72" font-family="Arial, sans-serif" font-size="17" fill="#111">сеанса.</text>
<text x="1044" y="1388.48" font-family="Arial, sans-serif" font-size="17" fill="#111"></text>
<text x="1044" y="1410.24" font-family="Arial, sans-serif" font-size="17" fill="#111">«Ход» запускает неподвижный лифт с</text>
<text x="1044" y="1432.0" font-family="Arial, sans-serif" font-size="17" fill="#111">маршрутом. Движущийся лифт меняет маршрут</text>
<text x="1044" y="1453.76" font-family="Arial, sans-serif" font-size="17" fill="#111">автоматически.</text>
<text x="1044" y="1475.52" font-family="Arial, sans-serif" font-size="17" fill="#111"></text>
<text x="1044" y="1497.28" font-family="Arial, sans-serif" font-size="17" fill="#111">Включение тревоги на паузе запрещено.</text>
<text x="1044" y="1649.22" font-family="Arial, sans-serif" font-size="17" fill="#111">Пользователь управляет своим сеансом.</text>
<text x="1044" y="1670.98" font-family="Arial, sans-serif" font-size="17" fill="#111">Администратор наследует его возможности и</text>
<text x="1044" y="1692.74" font-family="Arial, sans-serif" font-size="17" fill="#111">может управлять чужими сеансами.</text>
<text x="1044" y="1714.5" font-family="Arial, sans-serif" font-size="17" fill="#111"></text>
<text x="1044" y="1736.26" font-family="Arial, sans-serif" font-size="17" fill="#111">Моделируемые люди — объекты системы, а не</text>
<text x="1044" y="1758.02" font-family="Arial, sans-serif" font-size="17" fill="#111">внешние акторы.</text>
